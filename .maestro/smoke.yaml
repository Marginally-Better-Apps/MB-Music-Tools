appId: com.marginallybetterapps.musictools
name: Compact Tuner and Metronome shell
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Play a note when you are ready."
    timeout: 15000
- assertVisible: "Tuner"
- startRecording: e2e-demo-raw
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 2500
    optional: true
- tapOn: "Metronome"
- assertVisible: "Set a tempo when you are ready."
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 2500
    optional: true
- stopRecording
