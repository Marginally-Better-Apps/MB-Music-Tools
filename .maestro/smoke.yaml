appId: com.marginallybetterapps.musictools
name: Tuner and Metronome empty states
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Play a note when you are ready."
    timeout: 15000
- assertVisible: "Tuner"
- assertNotVisible: "Welcome to Expo"
- startRecording: e2e-demo-raw
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 4000
    optional: true
- tapOn: "Metronome"
- assertVisible: "Set a tempo when you are ready."
- assertNotVisible: "Welcome to Expo"
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 4000
    optional: true
- stopRecording
