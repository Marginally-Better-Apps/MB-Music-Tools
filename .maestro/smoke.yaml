appId: com.marginallybetterapps.musictools
name: Compact Tuner and Metronome shell
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Play a note when you are ready."
    timeout: 15000
- assertVisible: "Tuner"
- startRecording: e2e-demo-raw
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 4000
    optional: true
- repeat:
    times: 3
    while:
      notVisible: "Set a tempo when you are ready."
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Set a tempo when you are ready."
    timeout: 15000
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 4000
    optional: true
- stopRecording
