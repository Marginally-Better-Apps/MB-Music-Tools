appId: com.marginallybetterapps.musictools
name: Tuner and Metronome empty states
---
- launchApp
- extendedWaitUntil:
    visible: "Play a note when you are ready."
    timeout: 15000
- assertVisible: "Tuner"
- assertNotVisible: "Welcome to Expo"
- startRecording: e2e-demo-raw
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 4000
    optional: true
- repeat:
    times: 3
    while:
      notVisible: "Set a tempo when you are ready."
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Set a tempo when you are ready."
    timeout: 15000
- assertNotVisible: "Welcome to Expo"
- extendedWaitUntil:
    visible: "Recording hold"
    timeout: 4000
    optional: true
- stopRecording
