appId: com.marginallybetterapps.musictools
---
- launchApp
- repeat:
    times: 3
    while:
      notVisible: "Start metronome"
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- assertVisible: "120 BPM"
- assertVisible: "Start metronome"
- startRecording: metronome
- tapOn: "Start metronome"
- assertVisible: "Stop metronome"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Decrease tempo"
- assertVisible: "119 BPM"
- tapOn: "Increase tempo"
- assertVisible: "120 BPM"
- tapOn: "Stop metronome"
- assertVisible: "Start metronome"
- stopRecording
