appId: com.marginallybetterapps.musictools
---
- launchApp
- repeat:
    times: 3
    while:
      notVisible: "Start metronome"
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- assertVisible: "Time signature, 4/4 selected"
- repeat:
    times: 3
    commands:
      - swipe:
          start: 72%, 41%
          end: 72%, 10%
          duration: 900
- swipe:
    from:
      text: "Beat unit, 4"
    direction: UP
    duration: 650
- assertVisible: "Time signature, 32/32 selected"
- assertVisible: "Start metronome"
