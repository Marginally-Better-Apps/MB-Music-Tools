appId: com.marginallybetterapps.musictools
---
- launchApp:
    clearState: true
- tapOn:
    text: Allow
    optional: true
- tapOn: Metronome
- assertVisible: 'Beats per measure, 4'
- assertVisible: 'Note type, quarter note'
- repeat:
    times: 4
    commands:
      - swipe:
          from:
            text: 'Beats per measure, .*'
          direction: RIGHT
          duration: 700
- swipe:
    from:
      text: 'Note type, .*'
    direction: RIGHT
    duration: 700
- assertVisible: 'Beats per measure, 32'
- assertVisible: 'Note type, thirty-second note'
- assertVisible: Start metronome
