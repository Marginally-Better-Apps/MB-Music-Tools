appId: com.marginallybetterapps.musictools
---
- launchApp
- repeat:
    times: 3
    while:
      notVisible: "Start metronome"
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- assertVisible: "Time signature, 4/4 selected"
- startRecording: time-signature-drag
- longPressOn: "Increase tempo"
- assertNotVisible: "120 BPM"
- swipe:
    start: 72%, 41%
    end: 72%, 33%
    duration: 700
- swipe:
    start: 72%, 50%
    end: 72%, 47%
    duration: 450
- assertVisible: "Time signature, 7/8 selected"
- assertNotVisible: "Downbeat"
- tapOn: "Start metronome"
- assertVisible: "Stop metronome"
- assertVisible: "Metronome beat"
- tapOn: "Stop metronome"
- assertVisible: "Start metronome"
- stopRecording
