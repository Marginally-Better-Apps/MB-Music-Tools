appId: com.marginallybetterapps.musictools
---
- launchApp:
    clearState: true
- tapOn:
    text: "Open"
    optional: true
- repeat:
    times: 3
    while:
      notVisible: "Start metronome"
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- assertVisible: "Time signature, 4/4 selected"
- startRecording: time-signature-downbeat
- tapOn: "Increase beats per measure"
- tapOn: "Increase beats per measure"
- tapOn: "Increase beats per measure"
- tapOn: "Increase beat unit"
- assertVisible: "Time signature, 7/8 selected"
- tapOn: "Start metronome"
- assertVisible: "Stop metronome"
- extendedWaitUntil:
    visible: "Downbeat"
    timeout: 5000
- tapOn: "Stop metronome"
- assertVisible: "Start metronome"
- stopRecording
