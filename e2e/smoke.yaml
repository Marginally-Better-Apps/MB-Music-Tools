appId: com.marginallybetterapps.musictools
---
- launchApp
- assertVisible: "Play a note when you are ready."
- assertVisible: "Tuner"
- assertNotVisible: "Welcome to Expo"
- startRecording: smoke
- repeat:
    times: 3
    while:
      notVisible: "Set a tempo when you are ready."
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- assertVisible: "Set a tempo when you are ready."
- stopRecording
