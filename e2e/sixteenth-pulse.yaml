appId: com.marginallybetterapps.musictools
---
- launchApp
- repeat:
    times: 3
    while:
      notVisible: "Start metronome"
    commands:
      - tapOn:
          text: "Metronome"
          retryTapIfNoChange: true
- assertVisible: "Tempo, 120 BPM"
- assertVisible: "16th click rhythm"
- startRecording: sixteenth-glass-pulse
- tapOn: "16th click rhythm"
- tapOn: "Start metronome"
- assertVisible: "Stop metronome"
- extendedWaitUntil:
    visible: "Beat [1-4] of 4, pulse [1-4] of 4, 4/4"
    timeout: 10000
- repeat:
    times: 12
    commands:
      - assertVisible: "Beat [1-4] of 4, pulse [1-4] of 4, 4/4"
- tapOn: "Stop metronome"
- assertVisible: "Start metronome"
- stopRecording
